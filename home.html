<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vedioor | الصفحة الرئيسية</title>
  <link rel="stylesheet" href="CSS/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

</head>

<body>

  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="nav-content">
      <a href="home.html" class="logo">
        <span class="logo-text">فيديور</span>
      </a>

      <ul class="nav-links" id="navLinks">
        <li><a href="home.html" class="nav-link">الرئيسية</a></li>
        <li><a href="profile.html" class="nav-link">الملف الشخصي</a></li>

        <!-- Guest Users -->
        <li id="guest-nav-items">
          <div class="logo-btns" id="authBtns">
            <a id="loginBtn" class="auth-btn">تسجيل دخول</a>
            <a id="registerBtn" class="auth-btn">انشاء حساب</a>
          </div>
        </li>

        <!-- Logged Users -->
        <li id="logged-nav-items" style="display: none;">
          <div id="logout-div" style="display: flex; align-items: center; gap: 12px;">
            <b id="nav-username" style="color: var(--primary);"></b>
            <img id="nav-user-image" src="profile-pics/default-avatar.png" alt="User Avatar" class="avatar"
              style="width: 36px; height: 36px;">
            <a id="logout-btn" onclick="logout()" class="auth-btn">خروج</a>
          </div>
        </li>
      </ul>

      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span class="hamburger-icon">&#9776;</span>
      </button>
    </div>
  </nav>

  <main class="post-container">
    <div id="posts" style="width: 100%;">
      <!-- Posts will be injected here -->
      <div class="loader" style="text-align: center; padding: 40px;">جاري تحميل المنشورات...</div>
    </div>
  </main>

  <!-- Modals -->

  <!-- Login Modal -->
  <div id="myModal" class="modal">
    <div class="modal-content">
      <span class="close closeLogin">&times;</span>
      <h2>تسجيل دخول</h2>
      <div class="inputs">
        <label for="usernameInput">اسم المستخدم</label>
        <input type="text" id="usernameInput" placeholder="ادخل اسم المستخدم">

        <label for="passwordInput">كلمة المرور</label>
        <input type="password" id="passwordInput" placeholder="*******">

        <button onclick="loginBtnClicked()">دخول</button>
      </div>
    </div>
  </div>

  <!-- Register Modal -->
  <div id="reModal" class="modal">
    <div class="modal-content">
      <span class="close" id="closeRegister">&times;</span>
      <h2>انشاء حساب</h2>
      <div class="inputs">
        <label for="nickNameInput">الاسم المستعار</label>
        <input type="text" id="nickNameInput" placeholder="علي محمد">

        <label for="usernameInputRegister">اسم المستخدم</label>
        <input type="text" id="usernameInputRegister" placeholder="@amin123">

        <label for="passwordInputRegister">كلمة المرور</label>
        <input type="password" id="passwordInputRegister" placeholder="*******">

        <label for="register-image-input">الصورة الشخصية</label>
        <input type="file" id="register-image-input">

        <button onclick="registerBtnClicked()">انشاء حساب</button>
      </div>
    </div>
  </div>

  <!-- Add Post Modal -->
  <div id="postModal" class="modal">
    <div class="modal-content">
      <span class="close" id="closePost">&times;</span>
      <h2>وش في بالك؟</h2>
      <div class="inputs">
        <label for="post-title-input">العنوان</label>
        <input type="text" id="post-title-input" placeholder="عنوان المنشور">

        <label for="post-body-input">المحتوى</label>
        <textarea id="post-body-input" rows="4" placeholder="اكتب موضوعك هنا..."></textarea>

        <label for="post-image-input">صورة</label>
        <input type="file" id="post-image-input">

        <button onclick="createNewPostClicked()">انشر الـآن</button>
      </div>
    </div>
  </div>

  <!-- Toasts -->
  <div id="snackbar">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
      <polyline points="22 4 12 14.01 9 11.01"></polyline>
    </svg>
    <span>أهلاً بك مجدداً!</span>
  </div>

  <div id="registerSnackbar">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
      <polyline points="22 4 12 14.01 9 11.01"></polyline>
    </svg>
    <span>تم إنشاء الحساب بنجاح!</span>
  </div>

  <!-- Floating FAB -->
  <button class="floating-add-btn" aria-label="أضف منشور" id="add-btn" style="display: none;">
    +
  </button>

  <script src="JS/main.js"></script>
</body>

</html>
